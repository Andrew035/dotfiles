font_family JetBrains Mono
bold_font JetBrains Mono Bold
italic_font JetBrains Mono Italic
bold_italic_font JetBrains Mono Bold Italic
font_size 11
# macos_thicken_font 0.2
# font_features CaskaydiaCoveNFM-Italic +ss01
font_features JetBrainsMono-Regular +zero +calt -case +ccmp +ss03 +cv01 +cv05 +cv06 -cv08 +cv11 -cv12 -cv13
font_features JetBrainsMono-Bold +zero +calt -case +ccmp +ss03 +cv01 +cv05 +cv06 -cv08 +cv11 -cv12 -cv13
font_features JetBrainsMono-Italic +zero +calt -case +ccmp +ss03 +cv01 +cv05 +cv06 -cv08 +cv11 -cv12 -cv13
font_features JetBrainsMono-BoldItalic +zero +calt -case +ccmp +ss03 +cv01 +cv05 +cv06 -cv08 +cv11 -cv12 -cv13
disable_ligatures cursor

map cmd+1 goto_tab 1
map cmd+2 goto_tab 2
map cmd+3 goto_tab 3
map cmd+4 goto_tab 4
map cmd+5 goto_tab 5
map cmd+6 goto_tab 6
map cmd+7 goto_tab 7
map cmd+8 goto_tab 8
map cmd+9 goto_tab 9

cursor_blink_interval 0
mouse_hide_wait 2.0
open_url_with default
url_prefixes file ftp ftps gemini git gopher http https irc ircs kitty mailto news sftp ssh
detect_urls yes
copy_on_select yes
confirm_os_window_close 0

term xterm-kitty
colorterm truecolor

window_padding_width 10

enable_audio_bell no

# background_opacity 0.95
# dynamic_background_opacity yes
# background_blur 20

# Latency
input_delay 1
repaint_delay 8

hide_window_decorations titlebar-only

cursor_trail 10
cursor_trail_start_threshold 0
shell_integration no-cursor
cursor_trail_decay 0.01 0.15
cursor_shape block
cursor_blink false

shell tmux new-session -A -s main

# BEGIN_KITTY_THEME

# include themes/catppuccin-mocha.conf
# include themes/tokyonight.conf
# include themes/tokyonight-moon.conf
# include themes/gruvbox.conf
include themes/gruvbox-material.conf
# include themes/night-owl.conf
# include themes/kanagawa.conf

# END_KITTY_THEME

macos_quit_when_last_window_closed yes
